name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        version:
          - "1.12"
        os:
          - ubuntu-latest
          - macos-latest
        arch:
          - x64

    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - uses: julia-actions/cache@v2

      - name: Clone and develop local dependencies
        shell: bash
        env:
          NEWTON_GPUFFM_REV: 2ee57eb63147e620e395e20fcd08e21400b942eb
          NEWTON_DERHAM_REV: 59b331b818aaa7f169a33c42e600cbc6de9044f7
        run: |
          julia --project=. scripts/setup_deps.jl

      - uses: julia-actions/julia-runtest@v1
